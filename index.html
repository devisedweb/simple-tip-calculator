<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Tip Calculator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div>
        <h2>Bill Amount</h2>
        <input
          type="text"
          placeholder="$0.00"
          id="bill-input"
          class="bill-input"
        />

        <h2>Tip Amount</h2>
        <fieldset>
          <label for="tip-5">
            <input type="radio" name="tip-5" value="5" id="tip-5" />
            5%
          </label>

          <label for="tip-10">
            <input type="radio" name="tip-10" value="10" id="tip-10" />
            10%
          </label>

          <label for="tip-15">
            <input type="radio" name="tip-15" value="15" id="tip-15" />
            15%
          </label>
        </fieldset>
      </div>

      <div>
        <p id="total" class="total">Total:</p>
        <button id="button">Total</button>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
